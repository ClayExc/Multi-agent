[project]
name = "flowpilot-retrieval"
version = "0.1.0"
description = "FlowPilot deterministic hybrid retrieval engine"
requires-python = ">=3.12"
dependencies = [
    "flowpilot-application",
    "flowpilot-domain",
    "flowpilot-persistence",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flowpilot_retrieval"]

[tool.uv.sources]
flowpilot-application = { workspace = true }
flowpilot-domain = { workspace = true }
flowpilot-persistence = { workspace = true }
