[project]
name = "flowpilot-tool-contracts"
version = "0.1.0"
description = "Strict FlowPilot tool request, result, and schema pinning adapters"
requires-python = ">=3.12"
dependencies = [
    "flowpilot-domain",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flowpilot_tool_contracts"]

[tool.uv.sources]
flowpilot-domain = { workspace = true }
