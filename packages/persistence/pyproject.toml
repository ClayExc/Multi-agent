[project]
name = "flowpilot-persistence"
version = "0.1.0"
description = "FlowPilot PostgreSQL persistence and recoverable coordination adapters"
requires-python = ">=3.12"
dependencies = [
    "flowpilot-application",
    "flowpilot-domain",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flowpilot_persistence"]

[tool.uv.sources]
flowpilot-application = { workspace = true }
flowpilot-domain = { workspace = true }
