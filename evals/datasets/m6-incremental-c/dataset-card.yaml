dataset_id: flowpilot-m6-incremental-c-local
version: 0.1.0-candidate.1
status: candidate
candidate_only: true
release_eligible: false
declared_case_count: 16
purpose: >-
  M6 evaluation freeze preparation (incremental C, goal C1): 16 functional
  candidates — approval recovery 8 (m6c.func.ar.009-016) and long context &
  handoff 8 (m6c.func.lh.009-016) — completing the released
  approval_recovery and long_context_handoff functional quotas (16/16 each,
  cumulative with increment B) and moving the cumulative functional
  candidate count from 88 to 104. Every candidate is a full EvaluationCase
  v1 instance bound to a Feature (FP-EVAL-001), a Fixture
  (tenant-a / principal-basic-user), registry rule assertions, and an
  offline synthetic data source, and is validated by the released
  evaluation-registry validator.
scope:
  includes:
    - registry-validated functional candidates for the two categories above
    - offline synthetic data-source fixtures under evals/fixtures/
    - deterministic offline rebuild from in-repo sources only
  excludes:
    - release Dataset Registry membership (contracts/ is frozen)
    - safety/fault candidates (deferred; this increment is functional-only)
    - the remaining 120/36 release quotas (parallel_composite 16 and
      secret_dlp_audit 3 remain deferred beyond increment C)
    - network, provider, production credentials, RLS, and Outbox integration
    - "LLM-generated filler: none (every candidate is hand-curated; counts are
      not padded by generated quantity)"
measurement:
  denominator: all_declared_cases
  judge_policy: semantic_only_and_never_overrides_deterministic_gates
  random_seed: 0
  external_network: disabled
data_sources:
  by_category:
    approval_recovery: synthetic-approval-ledger-v1
    long_context_handoff: synthetic-ticket-store-v1
  fixtures:
    - id: synthetic-knowledge-corpus-v1
