[project]
name = "flowpilot-api"
version = "0.1.0"
description = "FlowPilot FastAPI command and task projection adapter"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "flowpilot-application",
    "flowpilot-domain",
    "flowpilot-security",
    "httpx>=0.28,<1",
    "pydantic>=2.10,<3",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flowpilot_api"]

[tool.uv.sources]
flowpilot-application = { workspace = true }
flowpilot-domain = { workspace = true }
flowpilot-security = { workspace = true }
