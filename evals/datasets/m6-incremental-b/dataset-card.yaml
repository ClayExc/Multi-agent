dataset_id: flowpilot-m6-incremental-b-local
version: 0.1.0-candidate.1
status: candidate
candidate_only: true
release_eligible: false
declared_case_count: 52
purpose: >-
  M6 evaluation freeze preparation (incremental B, goal B1): 40 functional
  candidates (business read-only queries 16, remaining ticket write with result
  verification 8, approval recovery 8, long context & handoff 8) plus 12
  safety/fault candidates (remaining approval replay / parameter tampering /
  duplicate write 3, provider/MCP/process failure and UNKNOWN reconciliation 6,
  secret / DLP / audit integrity 3). Every candidate is a full EvaluationCase
  v1 instance bound to a Feature, a Fixture, registry rule assertions, an
  offline data source, and a safety classification, and is validated by the
  released evaluation-registry validator. Together with increment A this
  reaches the cumulative 88 functional + 33 safety/fault intermediate
  milestone on the M6 120/36 freeze path.
scope:
  includes:
    - registry-validated candidates for the four functional categories above
    - registry-validated safety candidates for the three safety categories above
    - offline synthetic data-source fixtures under evals/fixtures/
    - offline fault-injection profiles under evals/fixtures/fault-profiles/
      (3 approval profiles reused from increment A plus 9 new additive
      provider-failure and DLP profiles registered below)
    - deterministic offline rebuild from in-repo sources only
  excludes:
    - release Dataset Registry membership (contracts/ is frozen)
    - the remaining 120/36 release quotas (approval_recovery 8, parallel_composite
      16, long_context_handoff 8, secret_dlp_audit 3 are deferred to increment C)
    - network, provider, production credentials, RLS, and Outbox integration
    - "LLM-generated filler: none (every candidate is hand-curated; counts are
      not padded by generated quantity)"
measurement:
  denominator: all_declared_cases
  judge_policy: semantic_only_and_never_overrides_deterministic_gates
  random_seed: 0
  external_network: disabled
data_sources:
  by_category:
    business_read: synthetic-ticket-store-v1
    ticket_write_verification: synthetic-ticket-store-v1
    approval_recovery: synthetic-approval-ledger-v1
    long_context_handoff: synthetic-ticket-store-v1
    approval_replay_tamper_duplicate_write: synthetic-approval-ledger-v1
    dependency_failure_unknown: synthetic-approval-ledger-v1
    secret_dlp_audit: synthetic-knowledge-corpus-v1
  fixtures:
    - id: synthetic-knowledge-corpus-v1
      path: evals/fixtures/synthetic-knowledge-corpus.v1.json
      sha256: sha256:fb1ec6663f1ce45be5f87323a7a2b02bec468a8856728f6ebc3571ae1c68a8a8
      synthetic: true
    - id: synthetic-tenant-directory-v1
      path: evals/fixtures/synthetic-tenant-directory.v1.json
      sha256: sha256:5054c9b530413bfca40103b7bd41a832cd47fabad59d3b875fee3ce10f79ea9b
      synthetic: true
    - id: synthetic-ticket-store-v1
      path: evals/fixtures/synthetic-ticket-store.v1.json
      sha256: sha256:1650e227dfb1e17913d857defca9fdf4d562df74d93a38a5665ca4450b5df819
      synthetic: true
    - id: synthetic-approval-ledger-v1
      path: evals/fixtures/synthetic-approval-ledger.v1.json
      sha256: sha256:f0258966a65b432546dfeaadeee2489ac6d064d58f3af9e96c396f30e2450940
      synthetic: true
  fault_profiles:
    - fault.art.approval-replay.v1
    - fault.art.param-tamper.v1
    - fault.art.duplicate-write.v1
    - fault.dep.provider-timeout.v1
    - fault.dep.provider-unknown.v1
    - fault.dep.gateway-unavailable.v1
    - fault.dep.partial-success.v1
    - fault.dep.downstream-timeout.v1
    - fault.dep.unknown-no-retry.v1
    - fault.dlp.secret-in-doc.v1
    - fault.dlp.export-request.v1
    - fault.dlp.pre-write-scan.v1
rebuild:
  procedure: >-
    python -c "from packages.evaluation.incremental_b import write_cases;
    from pathlib import Path; write_cases(Path('.'))"
    Regeneration is deterministic (stable JSON, sorted keys) and depends only
    on in-repo sources: curated CASE_SPECS, evals/fixtures, and the released
    manifests under contracts/. No external service is required. The rebuild
    guard test asserts regenerated bytes equal the committed files.
privacy:
  data: synthetic
  pii: none
  secrets: none
  credential_policy: zero real credentials (FP-SEC-006)
