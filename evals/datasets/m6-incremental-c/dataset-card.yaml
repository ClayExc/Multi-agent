rebuild:
  procedure: >-
    python -c "from packages.evaluation.incremental_c import write_cases;
    from pathlib import Path; write_cases(Path('.'))"
    Regeneration is deterministic (stable JSON, sorted keys) and depends only
    on in-repo sources: curated CASE_SPECS, evals/fixtures, and the released
    manifests under contracts/. No external service is required. The rebuild
    guard test asserts regenerated bytes equal the committed files.
privacy:
