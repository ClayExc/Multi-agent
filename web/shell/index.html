<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FlowPilot 工作台 · 轨道 C Web 外壳（合成 Fixture 演示）</title>
  <link rel="stylesheet" href="/static/shell.css" />
</head>
<body>
  <header class="app-header">
    <h1>FlowPilot 工作台 <span class="badge-demo">轨道 C Web 外壳 · 合成 Fixture 演示</span></h1>
    <nav class="app-nav">
      <a href="#/tasks" data-route="tasks">任务列表</a>
      <span id="sse-status" class="sse-status sse-connecting">SSE 连接中…</span>
    </nav>
  </header>

  <main id="view" class="app-view" aria-live="polite">
    <p class="loading">加载中…</p>
  </main>

  <footer class="app-footer">
    <p class="shell-note">
      本外壳不保存业务事实、不发起审批写调用、不直接访问 PostgreSQL/MCP；
      页面数据来自本地合成 Fixture（<code>web/fixtures/</code>）与模拟 API/SSE。
    </p>
    <div class="demo-controls">
      <span>演示控制：</span>
      <a class="btn btn-secondary" href="#/tasks" data-action="reset">恢复正常</a>
      <a class="btn btn-secondary" href="#/tasks/task_inventory_005?demo=unavailable" data-action="demo-503">模拟 API 不可用（503 错误面板）</a>
      <a class="btn btn-secondary" href="#/tasks/task_missing_9999" data-action="demo-404">模拟任务不存在（404 面板）</a>
      <a class="btn btn-secondary" href="#/tasks/task_repair_003" data-action="demo-waiting">信息补全（等待任务）</a>
      <a class="btn btn-secondary" href="#/tasks/task_onboard_004" data-action="demo-approval">审批卡（复合申请）</a>
    </div>
    <p id="event-ticker" class="event-ticker">最近事件：—</p>
  </footer>

  <script src="/static/app.js"></script>
</body>
</html>
