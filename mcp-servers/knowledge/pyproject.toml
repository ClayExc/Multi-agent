[project]
name = "flowpilot-mcp-knowledge"
version = "0.1.0"
description = "FlowPilot read-only deterministic knowledge MCP fixture"
requires-python = ">=3.12"
dependencies = [
    "flowpilot-mcp-gateway",
    "flowpilot-security",
    "flowpilot-tool-contracts",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flowpilot_mcp_knowledge"]

[tool.uv.sources]
flowpilot-mcp-gateway = { workspace = true }
flowpilot-security = { workspace = true }
flowpilot-tool-contracts = { workspace = true }
