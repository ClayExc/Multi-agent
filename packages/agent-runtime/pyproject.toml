[project]
name = "flowpilot-agent-runtime"
version = "0.1.0"
description = "FlowPilot provider-neutral bounded agent runtime"
requires-python = ">=3.12"
dependencies = [
    "flowpilot-context",
    "flowpilot-domain",
    "flowpilot-model-gateway",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flowpilot_agent_runtime"]

[tool.uv.sources]
flowpilot-context = { workspace = true }
flowpilot-domain = { workspace = true }
flowpilot-model-gateway = { workspace = true }
