      synthetic: true
    - id: synthetic-ticket-store-v1
      path: evals/fixtures/synthetic-ticket-store.v1.json
      sha256: sha256:1650e227dfb1e17913d857defca9fdf4d562df74d93a38a5665ca4450b5df819
      synthetic: true
    - id: synthetic-approval-ledger-v1
