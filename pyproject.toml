[project]
name = "flowpilot-workspace"
version = "0.1.0"
description = "FlowPilot internal Python workspace"
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk==0.2.134",
    "flowpilot-api",
    "flowpilot-application",
    "flowpilot-domain",
    "flowpilot-mcp-gateway",
    "flowpilot-mcp-knowledge",
    "flowpilot-persistence",
    "flowpilot-retrieval",
    "langgraph>=1.2,<2",
    "litellm==1.95.0",
    "openai-agents==0.19.4",
    "psycopg[binary,pool]>=3.2,<4",
    "redis>=5.2,<6",
    "sqlalchemy[asyncio]>=2.0,<3",
]

[dependency-groups]
dev = [
    "cryptography>=50,<51",
    "flowpilot-engineering-control",
    "httpx>=0.28,<1",
    "jsonschema>=4.23,<5",
    "langgraph-cli[inmem]>=0.4.31,<0.5",
    "mypy>=1.14,<2",
    "pip-audit>=2.9,<3",
    "pytest>=9.0.3,<10",
    "pytest-cov>=7,<8",
    "ruff>=0.9,<1",
    "types-PyYAML>=6.0.12,<7",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "apps/api",
    "apps/mcp-gateway",
    "apps/worker",
    "mcp-servers/knowledge",
    "mcp-servers/ticket",
    "packages/agent-runtime",
    "packages/application",
    "packages/context",
    "packages/domain",
    "packages/engineering-control",
    "packages/graph",
    "packages/model-gateway",
    "packages/persistence",
    "packages/policy",
    "packages/retrieval",
    "packages/security",
    "packages/tool-contracts",
]

[tool.uv.sources]
flowpilot-api = { workspace = true }
flowpilot-agent-runtime = { workspace = true }
flowpilot-application = { workspace = true }
flowpilot-context = { workspace = true }
flowpilot-domain = { workspace = true }
flowpilot-engineering-control = { workspace = true }
flowpilot-graph = { workspace = true }
flowpilot-mcp-gateway = { workspace = true }
flowpilot-mcp-knowledge = { workspace = true }
flowpilot-mcp-ticket = { workspace = true }
flowpilot-model-gateway = { workspace = true }
flowpilot-persistence = { workspace = true }
flowpilot-policy = { workspace = true }
flowpilot-retrieval = { workspace = true }
flowpilot-security = { workspace = true }
flowpilot-tool-contracts = { workspace = true }
flowpilot-worker = { workspace = true }

[tool.pytest.ini_options]
addopts = "-ra --strict-markers -p no:cacheprovider"
testpaths = ["tests/core", "tests/runtime", "tests/data", "tests/platform",
             "tests/acceptance", "tests/experience", "tests/integration"]

[tool.coverage.run]
branch = true
relative_files = true
source = [
    "apps/api/src",
    "apps/mcp-gateway/src",
    "apps/worker/src",
    "mcp-servers/knowledge/src",
    "mcp-servers/ticket/src",
    "packages/agent-runtime/src",
    "packages/application/src",
    "packages/context/src",
    "packages/domain/src",
    "packages/evaluation",
    "packages/graph/src",
    "packages/model-gateway/src",
    "packages/observability",
    "packages/persistence/src",
    "packages/policy/src",
    "packages/retrieval/src",
    "packages/security/src",
    "packages/tool-contracts/src",
    "web/src",
]

[tool.coverage.report]
fail_under = 80
precision = 1
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
