[project]
name = "flowpilot-worker"
version = "0.1.0"
description = "FlowPilot task worker and ExecutionPort adapter"
requires-python = ">=3.12"
dependencies = [
    "flowpilot-application",
    "flowpilot-domain",
    "flowpilot-graph",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flowpilot_worker"]

[tool.uv.sources]
flowpilot-application = { workspace = true }
flowpilot-domain = { workspace = true }
flowpilot-graph = { workspace = true }
