[project]
name = "flowpilot-model-gateway"
version = "0.1.0"
description = "FlowPilot provider-neutral model gateway port"
requires-python = ">=3.12"
dependencies = [
    "flowpilot-domain",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flowpilot_model_gateway"]

[tool.uv.sources]
flowpilot-domain = { workspace = true }
