name: flowpilot-m0-data

services:
  governance-config:
    image: alpine:3.21.3
    command:
      - sh
      - -ec
      - >-
        test "$$(wc -c < /run/secrets/governance_cursor_hmac)" -ge 32 &&
        echo 'fc82d6950308d8dc395a7a3718c2fb3c190a3445cf58851b6fc20a4b40c9c6a5  /bundle/flowpilot/authz.rego' | sha256sum -c - >/dev/null &&
        echo '2353d2f3f282befeb13daaf9337f2012210df0aa9d3776bb730535df74c62f9d  /bundle/data.json' | sha256sum -c - >/dev/null &&
        echo '9bbbed34df8ef49c7c471a1158ea94f7f2de74489c80d2351eeaecf80d8ca266  /bundle/.manifest' | sha256sum -c - >/dev/null
    secrets:
      - governance_cursor_hmac
    volumes:
      - ../opa/bundle:/bundle:ro
    restart: "no"

  postgres:
    image: postgres:17.5-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flowpilot}
      POSTGRES_USER: ${POSTGRES_USER:-flowpilot_migrator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../../migrations/0001_persistence_baseline.sql:/docker-entrypoint-initdb.d/001-persistence-baseline.sql:ro
      - ../../migrations/0002_checkpoint_sequence_cas.sql:/docker-entrypoint-initdb.d/002-checkpoint-sequence-cas.sql:ro
      - ../../migrations/0003_api_task_initialization.sql:/docker-entrypoint-initdb.d/003-api-task-initialization.sql:ro
      - ../../migrations/0004_security_context_rls_binding.sql:/docker-entrypoint-initdb.d/004-security-context-rls-binding.sql:ro
      - ../../migrations/0005_governance_audit_query.sql:/docker-entrypoint-initdb.d/005-governance-audit-query.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      - data-plane

  redis:
    image: redis:7.4.2-alpine
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --requirepass
      - ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli -a "$${REDIS_PASSWORD}" --no-auth-warning ping | grep PONG
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    networks:
      - coordination

  keycloak:
    image: quay.io/keycloak/keycloak:26.1.4
    command:
      - start-dev
      - --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-flowpilot-local-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD in .env}
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: http://127.0.0.1:${KEYCLOAK_PORT:-8081}
      FLOWPILOT_WEB_ORIGIN: ${FLOWPILOT_WEB_ORIGIN:?set FLOWPILOT_WEB_ORIGIN in .env}
      FLOWPILOT_OIDC_REDIRECT_URI: ${FLOWPILOT_OIDC_REDIRECT_URI:?set FLOWPILOT_OIDC_REDIRECT_URI in .env}
      KEYCLOAK_WEB_CLIENT_SECRET: ${KEYCLOAK_WEB_CLIENT_SECRET:?set KEYCLOAK_WEB_CLIENT_SECRET in .env}
      KEYCLOAK_WORKER_CLIENT_SECRET: ${KEYCLOAK_WORKER_CLIENT_SECRET:?set KEYCLOAK_WORKER_CLIENT_SECRET in .env}
      KEYCLOAK_GATEWAY_CLIENT_SECRET: ${KEYCLOAK_GATEWAY_CLIENT_SECRET:?set KEYCLOAK_GATEWAY_CLIENT_SECRET in .env}
      KEYCLOAK_TENANT_A_USER_PASSWORD: ${KEYCLOAK_TENANT_A_USER_PASSWORD:?set KEYCLOAK_TENANT_A_USER_PASSWORD in .env}
      KEYCLOAK_TENANT_A_APPROVER_PASSWORD: ${KEYCLOAK_TENANT_A_APPROVER_PASSWORD:?set KEYCLOAK_TENANT_A_APPROVER_PASSWORD in .env}
      KEYCLOAK_TENANT_B_USER_PASSWORD: ${KEYCLOAK_TENANT_B_USER_PASSWORD:?set KEYCLOAK_TENANT_B_USER_PASSWORD in .env}
      KEYCLOAK_TENANT_B_APPROVER_PASSWORD: ${KEYCLOAK_TENANT_B_APPROVER_PASSWORD:?set KEYCLOAK_TENANT_B_APPROVER_PASSWORD in .env}
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8081}:8080"
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ../keycloak/flowpilot-local-realm.json:/opt/keycloak/data/import/flowpilot-local-realm.json:ro
    healthcheck:
      test:
        - CMD-SHELL
        - "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'HEAD /health/ready HTTP/1.0\r\n\r\n' >&3; grep -qm1 'HTTP/1.0 200' <&3"
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 25s
    networks:
      - control-plane

  opa:
    image: openpolicyagent/opa:1.0.1
    command:
      - run
      - --server
      - --addr=:8181
      - --config-file=/config/config.yaml
      - --bundle
      - /bundle
    ports:
      - "127.0.0.1:${OPA_PORT:-8181}:8181"
    volumes:
      - ../opa/config.yaml:/config/config.yaml:ro
      - ../opa/bundle:/bundle:ro
    depends_on:
      governance-config:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - /opa
        - eval
        - --bundle
        - /bundle
        - data.flowpilot.authz.decisions
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - control-plane

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.120.0
    command:
      - --config=/etc/otelcol-contrib/config.yaml
    ports:
      - "127.0.0.1:${OTEL_GRPC_PORT:-4317}:4317"
      - "127.0.0.1:${OTEL_HTTP_PORT:-4318}:4318"
    volumes:
      - ../otel/collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    healthcheck:
      test:
        - CMD
        - /otelcol-contrib
        - --version
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - control-plane

volumes:
  postgres-data:
  keycloak-data:

networks:
  data-plane: {}
  coordination: {}
  control-plane: {}

secrets:
  governance_cursor_hmac:
    environment: FLOWPILOT_GOVERNANCE_CURSOR_HMAC_SECRET
