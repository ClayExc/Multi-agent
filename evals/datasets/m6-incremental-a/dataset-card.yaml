dataset_id: flowpilot-m6-incremental-a-local
version: 0.1.0-candidate.1
status: candidate
candidate_only: true
release_eligible: false
declared_case_count: 69
purpose: >-
  M6 evaluation freeze preparation (incremental A, goal e1): 48 functional
  candidates (knowledge Q&A with citation 24, clarification / multi-turn 16,
  ticket write with result verification 8) plus 21 safety/fault candidates
  (cross-tenant isolation 6, RBAC/ABAC and separation of duties 6, prompt
  injection / malicious MCP 6, approval replay / parameter tampering /
  duplicate write 3). Every candidate is a full EvaluationCase v1 instance
  bound to a Feature, a Fixture, registry rule assertions, an offline data
  source, and a safety classification, and is validated by the released
  evaluation-registry validator.
scope:
  includes:
    - registry-validated candidates for the three functional categories above
    - registry-validated safety candidates for the four safety categories above
    - offline synthetic data-source fixtures under evals/fixtures/
    - offline fault-injection profiles under evals/fixtures/fault-profiles/
    - deterministic offline rebuild from in-repo sources only
  excludes:
    - release Dataset Registry membership (contracts/ is frozen)
    - the remaining 120/36 release quotas (business_read, approval_recovery,
      parallel_composite, long_context_handoff, dependency_failure_unknown,
      secret_dlp_audit are deferred to later increments)
    - network, provider, production credentials, RLS, and Outbox integration
    - "LLM-generated filler: none (every candidate is hand-curated; counts are
      not padded by generated quantity)"
measurement:
  denominator: all_declared_cases
  judge_policy: semantic_only_and_never_overrides_deterministic_gates
  random_seed: 0
  external_network: disabled
data_sources:
  by_category:
    knowledge_qa_citation: synthetic-knowledge-corpus-v1
    clarification: synthetic-ticket-store-v1
    ticket_write_verification: synthetic-ticket-store-v1
    tenant_isolation: synthetic-tenant-directory-v1
    rbac_abac_sod: synthetic-tenant-directory-v1
    prompt_injection_malicious_mcp: synthetic-knowledge-corpus-v1
    approval_replay_tamper_duplicate_write: synthetic-approval-ledger-v1
  fixtures:
    - id: synthetic-knowledge-corpus-v1
      path: evals/fixtures/synthetic-knowledge-corpus.v1.json
      sha256: sha256:fb1ec6663f1ce45be5f87323a7a2b02bec468a8856728f6ebc3571ae1c68a8a8
      synthetic: true
    - id: synthetic-tenant-directory-v1
      path: evals/fixtures/synthetic-tenant-directory.v1.json
      sha256: sha256:5054c9b530413bfca40103b7bd41a832cd47fabad59d3b875fee3ce10f79ea9b
      synthetic: true
    - id: synthetic-ticket-store-v1
      path: evals/fixtures/synthetic-ticket-store.v1.json
      sha256: sha256:1650e227dfb1e17913d857defca9fdf4d562df74d93a38a5665ca4450b5df819
      synthetic: true
    - id: synthetic-approval-ledger-v1
      path: evals/fixtures/synthetic-approval-ledger.v1.json
      sha256: sha256:f0258966a65b432546dfeaadeee2489ac6d064d58f3af9e96c396f30e2450940
      synthetic: true
  fault_profiles:
    - fault.tenant.knowledge-scope.v1
    - fault.rbac.approval-revoked.v1
    - fault.pi.knowledge-doc.v1
    - fault.pi.tool-result.v1
    - fault.pi.mcp-forged-write.v1
    - fault.art.approval-replay.v1
    - fault.art.param-tamper.v1
    - fault.art.duplicate-write.v1
rebuild:
  procedure: >-
    python -c "from packages.evaluation.incremental_a import write_cases;
    from pathlib import Path; write_cases(Path('.'))"
    Regeneration is deterministic (stable JSON, sorted keys) and depends only
    on in-repo sources: curated CASE_SPECS, evals/fixtures, and the released
    manifests under contracts/. No external service is required. The rebuild
    guard test asserts regenerated bytes equal the committed files.
privacy:
  data: synthetic
  pii: none
  secrets: none
  credential_policy: zero real credentials (FP-SEC-006)
